name: Release APK

# Pushing a tag like v1.2.1 builds, tests and publishes signed APKs to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: SQLite for desktop tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload.jks"
          } > android/key.properties

      - name: Build signed release APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols

      - name: Verify offline manifest (no INTERNET) and minSdk >= 23
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          if "$AAPT" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo "::error::INTERNET permission found — app must stay offline"; exit 1; fi
          MIN=$("$AAPT" dump badging "$APK" | sed -n "s/^minSdkVersion:'\([0-9]*\)'.*/\1/p")
          echo "minSdk=$MIN"; [ "$MIN" -ge 23 ]

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
